name: Codestra Social CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - staging
      - 'contract/**'
      - 'security/**'
      - 'core/**'
      - 'webhooks/**'
      - 'integration/**'
      - 'observability/**'
      - 'ops/**'

permissions:
  contents: read

concurrency:
  group: codestra-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-test-build:
    name: Validate, migrate, test, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: codestra_ci
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d codestra_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CHECKPOINT_DISABLE: '1'
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/codestra_ci
      NEXT_PUBLIC_BACKEND_URL: http://127.0.0.1:3000
      REDIS_URL: redis://127.0.0.1:6379
      NODE_OPTIONS: --max-old-space-size=6144
      PRISMA_HIDE_UPDATE_MESSAGE: '1'
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.34.0

      - name: Use supported Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.14.0
          cache: pnpm

      - name: Install locked dependencies
        run: >-
          pnpm install --frozen-lockfile
          --package-import-method=copy
          --child-concurrency=1

      - name: Validate Prisma schema
        run: pnpm run prisma-validate

      - name: Apply all migrations to empty PostgreSQL
        run: pnpm run prisma-migrate-deploy

      - name: Confirm migration status
        run: pnpm run prisma-migrate-status

      - name: Exercise disposable database recovery and migration replay
        run: pnpm run test:db-recovery

      - name: Validate versioned contracts and deployment YAML
        run: >-
          pnpm exec prettier --check
          "contracts/**/*.{json,yaml}"
          "deploy/**/*.yaml"

      - name: Validate Kong and Caddy social isolation policy
        run: pnpm validate:kong-social

      - name: Validate fail-closed social release policy
        run: pnpm validate:social-release

      - name: Run focused security and control-plane tests
        run: pnpm run test:security

      - name: Build backend
        run: pnpm run build:backend

      - name: Build orchestrator
        run: pnpm run build:orchestrator

      - name: Build frontend
        run: pnpm run build:frontend

      - name: Install isolated browser runtime
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser, mobile, link, and accessibility gates
        run: pnpm run test:e2e:social

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codestra-social-test-evidence-${{ github.sha }}
          path: |
            junit.xml
            security-remediation/reports/
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
