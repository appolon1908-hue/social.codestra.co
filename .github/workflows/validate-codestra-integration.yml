name: Validate Codestra integration files

on:
  pull_request:
    paths:
      - "codestra/integration/**"
      - "monitoring/prometheus-target.disabled.yml"
      - "monitoring/codestra-social-recording-rules.yml"
      - "docs/CODESTRA-INTEGRATION-FILES.md"
      - "scripts/validate-codestra-integration.mjs"
      - ".github/workflows/validate-codestra-integration.yml"
  push:
    branches:
      - "codex/social-codestra-integration-files"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate integration files
        run: node scripts/validate-codestra-integration.mjs
