name: Immutable backend image

on:
  push:
    tags: ['social-v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: write

concurrency:
  group: immutable-social-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify main-reachable source
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact revision with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require source reachable from main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Reject moving images and destructive migrations
        run: |
          node scripts/validate-no-latest-images.mjs
          node scripts/validate-no-destructive-prisma.mjs

  publish:
    name: Build, attest, and publish exact image
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: artifact-release
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up BuildKit
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Capture release metadata
        id: metadata
        run: |
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "migration_head=$(find libraries/nestjs-libraries/src/database/prisma/migrations -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort | tail -1)" >> "$GITHUB_OUTPUT"
      - name: Build, publish, generate SBOM, and attest provenance
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.codestra
          push: true
          pull: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
          build-args: |
            BUILD_CREATED=${{ steps.metadata.outputs.created }}
            BUILD_VERSION=${{ github.sha }}
            NEXT_PUBLIC_VERSION=${{ github.sha }}
            SOURCE_REVISION=${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Create release evidence
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          MIGRATION_HEAD: ${{ steps.metadata.outputs.migration_head }}
        run: |
          mkdir -p release-evidence
          jq -n --arg source "$GITHUB_SHA" --arg digest "$DIGEST" --arg migration "$MIGRATION_HEAD" \
            '{source_sha:$source,image_digest:$digest,migration_head:$migration,capabilities:{social_publish:false,provider_writes:false,callback_processing:false,outbox_delivery:false,dead_letter_replay:false,billing_live_charge:false,odoo_write:false,n8n_delivery:false,klyrow_write:false,telnexa_write:false,production_deployment:false}}' \
            > release-evidence/manifest.json
          sha256sum release-evidence/manifest.json > release-evidence/manifest.sha256
      - name: Upload release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: immutable-image-${{ github.sha }}
          path: release-evidence/
          if-no-files-found: error
          retention-days: 90
