name: Publish immutable Codestra Social image

on:
  push:
    tags:
      - 'social-v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: write

concurrency:
  group: codestra-social-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify releasable revision
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CHECKPOINT_DISABLE: '1'
      DATABASE_URL: postgresql://codestra:codestra@127.0.0.1:5432/codestra_build
      NODE_OPTIONS: --max-old-space-size=6144
      PRISMA_HIDE_UPDATE_MESSAGE: '1'
    steps:
      - name: Check out exact revision with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require revision to be reachable from main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.34.0

      - name: Use supported Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.14.0
          cache: pnpm

      - name: Install locked dependencies
        run: >-
          pnpm install --frozen-lockfile
          --package-import-method=copy
          --child-concurrency=1

      - name: Validate schema and security controls
        run: |
          pnpm run prisma-validate
          pnpm run test:security

  image:
    name: Build and attest image
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: artifact-release
    needs: verify
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up BuildKit
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Capture build timestamp
        id: metadata
        run: |
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "migration_head=$(find libraries/nestjs-libraries/src/database/prisma/migrations -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort | tail -1)" >> "$GITHUB_OUTPUT"

      - name: Build, publish, generate SBOM, and attest provenance
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.codestra
          push: true
          pull: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.created=${{ steps.metadata.outputs.created }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
          build-args: |
            BUILD_CREATED=${{ steps.metadata.outputs.created }}
            BUILD_VERSION=${{ github.ref_name }}
            NEXT_PUBLIC_VERSION=${{ github.ref_name }}
            SOURCE_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Create release evidence manifest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_NAME: ghcr.io/${{ github.repository }}
          IMAGE_VERSION: ${{ github.ref_name }}
          SOURCE_REVISION: ${{ github.sha }}
          BUILD_CREATED: ${{ steps.metadata.outputs.created }}
          MIGRATION_HEAD: ${{ steps.metadata.outputs.migration_head }}
        run: |
          mkdir -p release
          jq -n \
            --arg image "$IMAGE_NAME" \
            --arg digest "$IMAGE_DIGEST" \
            --arg version "$IMAGE_VERSION" \
            --arg revision "$SOURCE_REVISION" \
            --arg created "$BUILD_CREATED" \
            --arg migration "$MIGRATION_HEAD" \
            '{image: $image, digest: $digest, version: $version, source_revision: $revision, build_created: $created, migration_head: $migration, contracts: {openapi: "1.0.0", asyncapi: "1.0.0"}, safety_flags: {social_publishing_enabled: false, external_delivery_enabled: false, publishing_kill_switch: true, middleware_outbox_enabled: false}}' \
            > release/image-manifest.json

      - name: Upload release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codestra-social-image-${{ github.sha }}
          path: release/image-manifest.json
          if-no-files-found: error
          retention-days: 90

      - name: Record immutable image reference
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: >-
          echo "Immutable image: ghcr.io/${{ github.repository }}@$IMAGE_DIGEST"
          >> "$GITHUB_STEP_SUMMARY"
