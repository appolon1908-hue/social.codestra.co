asyncapi: 3.0.0
info:
  title: Codestra Social normalized events
  version: 1.0.0
  description: Events emitted by Codestra Social to the Middleware signed inbox.
defaultContentType: application/json
channels:
  socialEvents:
    address: /v1/webhooks/social/events
    messages:
      socialEvent:
        $ref: '#/components/messages/SocialEvent'
operations:
  deliverSocialEvent:
    action: send
    channel:
      $ref: '#/channels/socialEvents'
    messages:
      - $ref: '#/channels/socialEvents/messages/socialEvent'
components:
  messages:
    SocialEvent:
      name: socialEvent
      title: Versioned Codestra social event
      payload:
        $ref: '#/components/schemas/EventEnvelope'
  schemas:
    EventEnvelope:
      type: object
      additionalProperties: false
      required:
        - event_id
        - event_type
        - event_version
        - occurred_at
        - received_at
        - source
        - tenant_id
        - correlation_id
        - idempotency_key
        - payload
      properties:
        event_id: { type: string, format: uuid }
        event_type:
          enum:
            - social.post.created
            - social.post.approved
            - social.post.scheduled
            - social.post.published
            - social.post.failed
            - social.channel.connected
            - social.channel.expiring
            - social.channel.disconnected
            - social.comment.received
            - social.mention.received
            - social.lead.captured
        event_version: { const: '1.0' }
        occurred_at: { type: string, format: date-time }
        received_at: { type: string, format: date-time }
        source: { const: codestra-social }
        tenant_id: { type: string, minLength: 1, maxLength: 100 }
        customer_id: { type: [string, 'null'] }
        correlation_id: { type: string, format: uuid }
        causation_id: { type: [string, 'null'] }
        idempotency_key: { type: string, minLength: 16, maxLength: 200 }
        payload: { type: object, additionalProperties: true }
        metadata:
          type: object
          additionalProperties: true
          properties:
            provider: { type: string }
            provider_account_id: { type: string }
            provider_event_id: { type: string }
  securitySchemes:
    signedWebhook:
      type: httpApiKey
      in: header
      name: X-Codestra-Signature
